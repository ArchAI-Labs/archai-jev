[package]
name = "archai_jev"
version = "0.1.0"
edition = "2024"
description = "High-performance Rust runtime for System One decision models (typed answers with calibrated probabilities)."
license = "Apache-2.0"
repository = "https://github.com/ArchAI-Labs/archai-jev"
readme = "README.md"
publish = false

[lib]
name = "_core"
# cdylib: the Python extension; rlib: lets Rust integration tests and benches link the core.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
thiserror = "2"
# Model loading (spec 005, D35). No `derive` and no `preserve_order`: our own `Json` keeps key order.
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
# Tokenizer validation (and, in 006, tokenization). Spike T10: 0.22.2 with fancy-regex gives the same ids as
# Python on the Qwen2.5 and Kev tokenizer.json files; pure Rust, no extra C build.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# The inference engine (spec 006b, D22/D37): llama.cpp through a safe wrapper, pinned exactly.
llama-cpp-2 = { version = "=0.1.157", default-features = false }
# Its C++ half, pinned to the same version (a plain `^0.1.157` would resolve to 0.1.158).
llama-cpp-sys-2 = { version = "=0.1.157", default-features = false }
# Only for the fake checkpoint builder of the `testing` feature.
tempfile = { version = "3", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[features]
# Fake backend, fake converter, tiny checkpoint builder and test server. Off in release wheels.
testing = ["dep:tempfile"]
# Study rows of spec 009: the K-quant dtypes (`q6_k`, `q5_k_m`, `q4_k_m`) are accepted with a
# permissive recipe and a tolerance that refuses nothing, so that they can be MEASURED. Never in
# release wheels: a dtype is a real name only after it passes the admission gate of the spec.
quant-study = []
# GPU backends of llama.cpp (spec 011). Off in every wheel on PyPI, which are CPU-only; each is a
# build from source (`maturin build --release --features cuda`, see docs/gpu.md) or a wheel
# published for that backend. They only forward to the wrapper, so they add no dependency.
# `cuda`: NVIDIA, needs the CUDA Toolkit (12.8 or later for Blackwell `sm_120`) and, on Windows,
# `CUDA_PATH_V12_x` and `CMAKE_CUDA_ARCHITECTURES` in the environment.
cuda = ["llama-cpp-2/cuda"]
# `cuda-no-vmm`: the same without the import of `nvcuda.dll`, so that `import archai_jev` also
# works on a machine with no NVIDIA driver (measured in the spike S14).
cuda-no-vmm = ["llama-cpp-2/cuda-no-vmm"]
# `vulkan`: NVIDIA, AMD and Intel; needs the Vulkan SDK (`VULKAN_SDK`) and, on Windows,
# `CMAKE_GENERATOR=Ninja` with the MSVC environment (the Visual Studio generator fails).
vulkan = ["llama-cpp-2/vulkan"]
# `metal`: Apple GPUs, macOS only; needs `GGML_METAL=ON` in the environment because
# `.cargo/config.toml` switches it off, and `build.rs` stops the build if it is not set.
metal = ["llama-cpp-2/metal"]

[[test]]
name = "spark_letters_header"
required-features = ["testing"]

[[test]]
name = "spark_letters_ids"
required-features = ["testing"]

[[test]]
name = "spark_letters_real"
required-features = ["testing"]

[[test]]
name = "spark_letters_bench"
required-features = ["testing"]

[[test]]
name = "golden_ids"
required-features = ["testing"]

[[test]]
name = "fixture_kev_golden"
required-features = ["testing"]

[[test]]
name = "default_model"
required-features = ["testing"]

[[test]]
name = "quantization_dataset_ids"
required-features = ["testing"]

[[test]]
name = "quantized_vectors"
required-features = ["testing"]

[[test]]
name = "v2_parity"
required-features = ["testing"]

[[test]]
name = "default_calibration"
required-features = ["testing"]

[[test]]
name = "kev_mutants"
required-features = ["testing"]

[[test]]
name = "prompt_props"
required-features = ["testing"]

[[test]]
name = "kev_conversion"
required-features = ["testing"]

[[test]]
name = "kev_parity"
required-features = ["testing"]

[[test]]
name = "kev_bench"
required-features = ["testing"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
