# CI probe, NOT part of the product. Answers one question before feature 006 (D22): does llama.cpp (via `llama-cpp-2`)
# build, link into an abi3 Python extension, pass auditwheel and run on every wheel target? It has its own [workspace],
# so the main crate (`cargo fmt/clippy/test` at the repository root) never sees it.
[package]
name = "llama_probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Build probe for the llama.cpp backend; not published."
license = "Apache-2.0"

[lib]
name = "llama_probe"
crate-type = ["cdylib"]

[features]
default = []
# Variant matrix of the workflow: ggml's own thread pool (default) or OpenMP.
openmp = ["llama-cpp-2/openmp"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
# Pinned exactly (D22: third-party 0.1.x crate). CPU only, no `common` (sampling, grammars) and no GPU features.
llama-cpp-2 = { version = "=0.1.157", default-features = false }
llama-cpp-sys-2 = { version = "=0.1.157", default-features = false }

[workspace]

# Same release profile as the main crate, so what is probed is what would ship.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
