# Quality gate, abi3 wheel builds and PyPI release (Trusted Publishing).
# Originally generated by maturin v1.15.0 (`maturin generate-ci github`), then adapted.
name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          # Oldest supported Python.
          - os: ubuntu-latest
            python: "3.10"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev dependencies
        run: uv sync --no-install-project
      - name: Point PyO3 at the venv interpreter
        run: echo "PYO3_PYTHON=$(uv run --no-sync python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test
      - name: Build extension
        run: uv run --no-sync maturin develop --uv
      - name: Python format
        run: uv run --no-sync black --check python tests
      - name: Python lint
        run: uv run --no-sync ruff check python tests
      - name: Type check
        run: uv run --no-sync mypy
      - name: Stub matches compiled module
        run: uv run --no-sync python -m mypy.stubtest archai_jev._core
      - name: Python tests
        run: uv run --no-sync pytest

  linux:
    # aarch64 builds on a native ARM runner so its wheel can be smoke-tested too.
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - uses: astral-sh/setup-uv@v7
      - name: Smoke test (oldest and newest supported Python)
        shell: bash
        run: |
          for py in 3.10 3.14; do
            uv venv --python "$py" ".smoke-$py"
            if [ -x ".smoke-$py/bin/python" ]; then PY=".smoke-$py/bin/python"; else PY=".smoke-$py/Scripts/python.exe"; fi
            uv pip install --python "$PY" dist/*.whl
            "$PY" -c "import archai_jev; print(archai_jev.calibrated_softmax([1.0, 2.0]))"
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: astral-sh/setup-uv@v7
      - name: Smoke test (oldest and newest supported Python)
        shell: bash
        run: |
          for py in 3.10 3.14; do
            uv venv --python "$py" ".smoke-$py"
            if [ -x ".smoke-$py/bin/python" ]; then PY=".smoke-$py/bin/python"; else PY=".smoke-$py/Scripts/python.exe"; fi
            uv pip install --python "$PY" dist/*.whl
            "$PY" -c "import archai_jev; print(archai_jev.calibrated_softmax([1.0, 2.0]))"
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: astral-sh/setup-uv@v7
      - name: Smoke test (oldest and newest supported Python)
        shell: bash
        run: |
          for py in 3.10 3.14; do
            uv venv --python "$py" ".smoke-$py"
            if [ -x ".smoke-$py/bin/python" ]; then PY=".smoke-$py/bin/python"; else PY=".smoke-$py/Scripts/python.exe"; fi
            uv pip install --python "$PY" dist/*.whl
            "$PY" -c "import archai_jev; print(archai_jev.calibrated_softmax([1.0, 2.0]))"
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: Build and test from source (platforms without a wheel)
        run: |
          uv venv --python 3.10 .smoke
          uv pip install --python .smoke/bin/python dist/*.tar.gz
          .smoke/bin/python -c "import archai_jev; print(archai_jev.calibrated_softmax([1.0, 2.0]))"
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    # Runs only on a version tag pushed by the maintainer.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [quality, linux, macos, windows, sdist]
    environment: pypi
    permissions:
      # Trusted Publishing (OIDC) to PyPI, no stored token.
      id-token: write
      # Artifact attestation.
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always 'wheels-*/*'
