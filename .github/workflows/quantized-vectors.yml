# Manual job (spec 009, T14): do the vectors that the engine recorded on the Q4_K_M file of the default
# model reproduce on the other platforms? Each platform downloads the exact file (SHA-256 checked),
# runs the 12 recorded requests, and reports the largest difference in probability from the recorded
# numbers. `tol_p` of the variant is set from the largest of these (at least twice, at most 0.05).
#
# It is not part of CI: it downloads ~1 GB per platform. The "Run workflow" button only exists for workflows
# on the default branch, so it also starts once when this file is pushed to develop; remove that trigger
# (the `push:` block) when the measurement is in the report.
name: Quantized vectors

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/quantized-vectors.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same pin as CI.yml.
  RUST_VERSION: "1.99.1"
  # The file under test: repository, revision and SHA-256 of the published Q4_K_M.
  GGUF_URL: https://huggingface.co/nickprock/archai-jev-qwen-1.5b/resolve/0dbce0f4538e13ccf3b09fb144b6d5f0b92aebe5/archai-jev-qwen1.5b-q4_k_m.gguf
  GGUF_SHA256: 0f768dbb6978f19e24779faf4a8963e7258148e02544a9aa5733b3c686ad1f86
  TOKENIZER_URL: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct/resolve/989aa7980e4cf806f80c7fef2b1adb7bc71aa306/tokenizer.json
  TOKENIZER_SHA256: c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539

jobs:
  reproduce:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-latest }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows-x86_64, runner: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Windows build environment
        if: runner.os == 'Windows'
        run: |
          echo "CARGO_TARGET_DIR=C:\t" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      - name: macOS x86_64 deployment target
        if: matrix.name == 'macos-x86_64'
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Point PyO3 at an interpreter
        run: |
          uv venv .pyo3
          if [ -x .pyo3/bin/python ]; then PY="$PWD/.pyo3/bin/python"; else PY="$PWD/.pyo3/Scripts/python.exe"; fi
          echo "PYO3_PYTHON=$PY" >> "$GITHUB_ENV"
      - name: Cache the model file
        id: gguf
        uses: actions/cache@v5
        with:
          path: q4_k_m.gguf
          key: q4_k_m-${{ env.GGUF_SHA256 }}
      - name: Download the model file
        if: steps.gguf.outputs.cache-hit != 'true'
        run: curl -fL --retry 4 --retry-delay 10 -o q4_k_m.gguf "$GGUF_URL"
      - name: Download the tokenizer
        run: curl -fL --retry 4 --retry-delay 5 -o tokenizer.json "$TOKENIZER_URL"
      - name: Check the files
        run: |
          printf '%s\n' "$GGUF_SHA256  q4_k_m.gguf" "$TOKENIZER_SHA256  tokenizer.json" > files.sha256
          if command -v sha256sum >/dev/null; then sha256sum -c files.sha256; else shasum -a 256 -c files.sha256; fi
      - name: Reproduce the recorded vectors
        run: |
          export ARCHAI_JEV_TEST_DEFAULT_TOKENIZER="$PWD/tokenizer.json"
          export ARCHAI_JEV_TEST_V2_GGUF="$PWD/q4_k_m.gguf"
          cargo test --release --features testing --test quantized_vectors the_recorded_vectors_reproduce -- --include-ignored --nocapture 2>&1 | tee reproduce.log
      - name: Report
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            grep -E "max \|dp\| =|CROSS_PLATFORM|test result" reproduce.log || echo "no result (see the log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reproduce-${{ matrix.name }}
          path: reproduce.log
